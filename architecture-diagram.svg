<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#000814"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f8ef7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowBlueUp" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4f8ef7"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#4f8ef7" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="780"/><line x1="300" y1="0" x2="300" y2="780"/>
    <line x1="450" y1="0" x2="450" y2="780"/><line x1="600" y1="0" x2="600" y2="780"/>
    <line x1="750" y1="0" x2="750" y2="780"/><line x1="900" y1="0" x2="900" y2="780"/>
    <line x1="1050" y1="0" x2="1050" y2="780"/>
  </g>

  <!-- Title -->
  <text x="600" y="36" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="3">SIGHTLINE — SYSTEM ARCHITECTURE</text>

  <!-- ═══════════════════════════════════ -->
  <!-- ZONE 1: USER DEVICE                -->
  <!-- ═══════════════════════════════════ -->
  <rect x="200" y="55" width="800" height="185" rx="14" fill="#0d1527" stroke="#4f8ef7" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Device label badge -->
  <rect x="330" y="47" width="260" height="22" rx="11" fill="#0d1527" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.6"/>
  <text x="460" y="62" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#4f8ef7" text-anchor="middle" letter-spacing="2" font-weight="600">USER'S DEVICE — PWA (Next.js)</text>

  <!-- Camera box -->
  <rect x="240" y="80" width="220" height="70" rx="8" fill="#101d35" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.6"/>
  <text x="268" y="103" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">📷  CAMERA</text>
  <text x="268" y="122" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">getUserMedia API</text>
  <text x="268" y="138" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">JPEG · 1 fps</text>

  <!-- Mic box -->
  <rect x="490" y="80" width="220" height="70" rx="8" fill="#101d35" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.6"/>
  <text x="518" y="103" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">🎙  MICROPHONE</text>
  <text x="518" y="122" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">getUserMedia API</text>
  <text x="518" y="138" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">PCM 16-bit · 16kHz</text>

  <!-- Audio Playback box -->
  <rect x="740" y="80" width="220" height="70" rx="8" fill="#101d35" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
  <text x="768" y="103" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">🔊  AUDIO PLAYBACK</text>
  <text x="768" y="122" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Web Audio API</text>
  <text x="768" y="138" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Real-time streaming</text>

  <!-- Camera + Mic → WebSocket arrows -->
  <line x1="350" y1="150" x2="490" y2="185" stroke="#4f8ef7" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="150" x2="540" y2="185" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowPurple)"/>

  <!-- WebSocket Client box (inside device) -->
  <rect x="390" y="185" width="300" height="44" rx="8" fill="#162040" stroke="#4f8ef7" stroke-width="1.5"/>
  <text x="540" y="204" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600" letter-spacing="1">WEBSOCKET CLIENT</text>
  <text x="540" y="220" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Video Frames + Audio Chunks · Bidirectional</text>

  <!-- ═══════════════════════════════════ -->
  <!-- WEBSOCKET ARROW (middle)           -->
  <!-- ═══════════════════════════════════ -->
  <!-- Down arrow (upstream) -->
  <line x1="530" y1="229" x2="530" y2="293" stroke="#4f8ef7" stroke-width="2" marker-end="url(#arrowBlue)" filter="url(#glow)"/>
  <!-- Up arrow (downstream) -->
  <line x1="560" y1="293" x2="560" y2="229" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" filter="url(#glow)"/>

  <!-- Websocket labels -->
  <text x="580" y="256" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#4f8ef7">▲ Audio + Video (upstream)</text>
  <text x="580" y="272" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#34d399">▼ Audio Responses (downstream)</text>
  <rect x="415" y="249" width="100" height="18" rx="9" fill="#0d1527" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="465" y="261" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#4f8ef7" text-anchor="middle" letter-spacing="1">wss://</text>

  <!-- ═══════════════════════════════════ -->
  <!-- ZONE 2: GOOGLE CLOUD PLATFORM      -->
  <!-- ═══════════════════════════════════ -->
  <rect x="60" y="300" width="1080" height="340" rx="14" fill="#08101e" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.25"/>
  <!-- GCP label badge -->
  <rect x="460" y="291" width="280" height="22" rx="11" fill="#08101e" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="600" y="306" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#4f8ef7" text-anchor="middle" letter-spacing="2" font-weight="600">GOOGLE CLOUD PLATFORM</text>

  <!-- CLOUD RUN box -->
  <rect x="90" y="318" width="730" height="295" rx="12" fill="#0d1527" stroke="#4f8ef7" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="340" y="310" width="160" height="20" rx="10" fill="#0d1527" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="420" y="324" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#4f8ef7" text-anchor="middle" letter-spacing="2" font-weight="600">CLOUD RUN</text>

  <!-- ADK Streaming Runner box -->
  <rect x="115" y="338" width="490" height="255" rx="10" fill="#101d35" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
  <text x="360" y="357" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" letter-spacing="2" font-weight="600">ADK STREAMING RUNNER</text>

  <!-- LiveRequestQueue box -->
  <rect x="135" y="365" width="220" height="110" rx="8" fill="#0d1a30" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="245" y="384" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#4f8ef7" text-anchor="middle" letter-spacing="1" font-weight="600">LiveRequestQueue</text>
  <text x="148" y="402" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b">• Buffers audio chunks</text>
  <text x="148" y="418" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b">• Buffers video frames</text>
  <text x="148" y="434" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b">• Manages barge-in</text>
  <text x="148" y="450" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b">• Session lifecycle</text>
  <text x="148" y="466" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b">• Reconnection logic</text>

  <!-- SightLineAgent box -->
  <rect x="380" y="365" width="210" height="210" rx="8" fill="#0d1a30" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="485" y="384" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" letter-spacing="1" font-weight="600">SightLineAgent</text>
  <text x="393" y="402" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Root ADK Agent</text>
  <line x1="393" y1="408" x2="578" y2="408" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="393" y="424" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#94a3b8">Model:</text>
  <text x="393" y="439" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="8.5" fill="#4f8ef7">gemini-2.5-flash-</text>
  <text x="393" y="452" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="8.5" fill="#4f8ef7">native-audio-preview</text>
  <line x1="393" y1="460" x2="578" y2="460" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="393" y="475" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#94a3b8">Modes:</text>
  <text x="393" y="490" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Navigation · Reading</text>
  <text x="393" y="504" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Shopping · Social</text>
  <line x1="393" y1="512" x2="578" y2="512" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="393" y="527" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#94a3b8">Output:</text>
  <text x="393" y="542" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#34d399">Native AUDIO</text>
  <text x="393" y="557" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Voice: Aoede</text>

  <!-- Arrow: LiveRequestQueue → SightLineAgent -->
  <line x1="355" y1="420" x2="378" y2="420" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Function Calling Tools box -->
  <rect x="625" y="338" width="175" height="250" rx="8" fill="#101d35" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
  <text x="712" y="358" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="10" fill="#34d399" text-anchor="middle" letter-spacing="1" font-weight="600">TOOLS</text>
  <text x="638" y="380" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#94a3b8">Function Calling</text>
  <line x1="638" y1="386" x2="788" y2="386" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="638" y="405" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">switch_mode(mode)</text>
  <text x="638" y="423" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">save_preference(k,v)</text>
  <text x="638" y="441" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">capture_frame()</text>
  <text x="638" y="459" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">get_session_history()</text>
  <text x="638" y="477" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">emergency_alert()</text>

  <!-- Agent → Tools arrow -->
  <line x1="590" y1="455" x2="623" y2="455" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ═══════════════════════════════════ -->
  <!-- BOTTOM SERVICES ROW                -->
  <!-- ═══════════════════════════════════ -->

  <!-- Arrows down from Cloud Run to services -->
  <!-- Vertex AI arrow -->
  <line x1="250" y1="613" x2="250" y2="648" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <!-- Firestore arrow -->
  <line x1="500" y1="613" x2="500" y2="648" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <!-- Cloud Storage arrow -->
  <line x1="710" y1="580" x2="710" y2="648" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Vertex AI -->
  <rect x="90" y="648" width="250" height="90" rx="10" fill="#0d1527" stroke="#4f8ef7" stroke-width="1.5"/>
  <text x="215" y="669" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#4f8ef7" text-anchor="middle" font-weight="700" letter-spacing="1">Vertex AI</text>
  <text x="215" y="686" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Gemini Live API</text>
  <text x="215" y="702" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Bidirectional Audio + Video</text>
  <text x="215" y="718" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Streaming via WebSocket</text>
  <text x="215" y="730" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">us-central1</text>

  <!-- Firestore -->
  <rect x="370" y="648" width="250" height="90" rx="10" fill="#0d1527" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="495" y="669" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700" letter-spacing="1">Firestore</text>
  <text x="495" y="686" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Sessions · User Prefs</text>
  <text x="495" y="702" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Conversation History</text>
  <text x="495" y="718" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Gamification Data</text>
  <text x="495" y="734" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Real-time NoSQL</text>

  <!-- Cloud Storage -->
  <rect x="650" y="648" width="220" height="90" rx="10" fill="#0d1527" stroke="#34d399" stroke-width="1.5"/>
  <text x="760" y="669" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="1">Cloud Storage</text>
  <text x="760" y="686" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Captured Frames</text>
  <text x="760" y="702" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Session Snapshots</text>
  <text x="760" y="718" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">7-day auto-cleanup</text>

  <!-- Cloud Logging -->
  <rect x="900" y="648" width="200" height="90" rx="10" fill="#0d1527" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1000" y="669" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" letter-spacing="1">Cloud Logging</text>
  <text x="1000" y="686" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Error Rates</text>
  <text x="1000" y="702" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Latency Metrics</text>
  <text x="1000" y="718" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Usage Analytics</text>

  <!-- Cloud Logging arrow from Cloud Run -->
  <line x1="820" y1="455" x2="1000" y2="455" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="1000" y1="455" x2="1000" y2="648" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>

  <!-- Vertex AI ↔ SightLineAgent bidirectional arrow -->
  <!-- Left side arrow out of Cloud Run down to Vertex AI -->
  <line x1="250" y1="338" x2="250" y2="293" stroke="#4f8ef7" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arrowBlue)"/>
  <!-- Vertex AI label for top connection -->
  <text x="258" y="320" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="9" fill="#4f8ef7">Gemini Live API</text>

  <!-- Bottom gradient bar -->
  <rect x="0" y="770" width="1200" height="3" fill="url(#titleGrad)" opacity="0.7"/>
</svg>
