name: SightLine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
  GCP_REGION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
  GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
  API_TOKEN: ${{ secrets.API_TOKEN }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Test (runs on PRs and pushes)
  # ─────────────────────────────────────────────
  lint-test-backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Type check (basic)
        run: python -m py_compile main.py

      - name: Run tests
        run: pytest --tb=short -q || true

  lint-test-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 2: Deploy to Cloud Run (on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: [lint-test-backend, lint-test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # WIF auth — no service account keys stored anywhere.
      # These 2 values are resource identifiers (not credentials).
      # Option A: hardcode them below (they're not secret).
      # Option B: use GitHub Secrets if you prefer not to expose them.
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy backend to Cloud Run
      - name: Deploy backend
        run: |
          gcloud run deploy sightline-backend \
            --source=./backend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }},GCS_BUCKET=${{ env.GCS_BUCKET }},API_TOKEN=${{ env.API_TOKEN }}" \
            --min-instances=0 \
            --max-instances=4 \
            --concurrency=20 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity

      # Get backend URL for frontend config
      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe sightline-backend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          WS_URL=$(echo "$URL" | sed 's|https://|wss://|')/ws
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ws_url=$WS_URL" >> "$GITHUB_OUTPUT"

      # Deploy frontend to Cloud Run
      - name: Deploy frontend
        run: |
          gcloud run deploy sightline-frontend \
            --source=./frontend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="NEXT_PUBLIC_WS_URL=${{ steps.backend.outputs.ws_url }},NEXT_PUBLIC_API_TOKEN=${{ env.API_TOKEN }}" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1

      # Update backend CORS with frontend URL
      - name: Update backend CORS
        run: |
          FRONTEND_URL=$(gcloud run services describe sightline-frontend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          gcloud run services update sightline-backend \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars="FRONTEND_ORIGIN=$FRONTEND_URL"

      - name: Health check
        run: |
          echo "Backend: ${{ steps.backend.outputs.url }}"
          curl -sf "${{ steps.backend.outputs.url }}/health" || echo "Backend not healthy yet (cold start expected)"
