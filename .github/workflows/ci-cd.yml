name: SightLine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Test (runs on PRs and pushes)
  # ─────────────────────────────────────────────
  lint-test-backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Type check (basic)
        run: python -m py_compile main.py

      - name: Run tests
        run: pytest --tb=short -q || true

  lint-test-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 2: Deploy to Cloud Run (on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: [lint-test-backend, lint-test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GCP_REGION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Debug secrets
        run: |
          echo "Project length: ${#GCP_PROJECT}"
          echo "Region length: ${#GCP_REGION}"
          echo "Project starts with: ${GCP_PROJECT:0:3}***"

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            firestore.googleapis.com \
            storage.googleapis.com \
            --project="$GCP_PROJECT" \
            --quiet

      - name: Deploy backend
        run: |
          gcloud run deploy sightline-backend \
            --quiet \
            --source=./backend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=$GCP_PROJECT,GOOGLE_CLOUD_LOCATION=$GCP_REGION,GCS_BUCKET=$GCS_BUCKET,API_TOKEN=$API_TOKEN" \
            --min-instances=0 \
            --max-instances=4 \
            --concurrency=20 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe sightline-backend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format="value(status.url)")
          WS_URL=$(echo "$URL" | sed 's|https://|wss://|')/ws
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ws_url=$WS_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: |
          gcloud run deploy sightline-frontend \
            --quiet \
            --source=./frontend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="NEXT_PUBLIC_WS_URL=${{ steps.backend.outputs.ws_url }},NEXT_PUBLIC_API_TOKEN=$API_TOKEN" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1

      - name: Update backend CORS
        run: |
          FRONTEND_URL=$(gcloud run services describe sightline-frontend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format="value(status.url)")
          gcloud run services update sightline-backend --quiet \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --update-env-vars="FRONTEND_ORIGIN=$FRONTEND_URL"

      - name: Health check
        run: |
          echo "Backend: ${{ steps.backend.outputs.url }}"
          curl -sf "${{ steps.backend.outputs.url }}/health" || echo "Backend not healthy yet (cold start expected)"
