name: SightLine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AR_REPO: sightline
  BACKEND_IMAGE: sightline-backend
  FRONTEND_IMAGE: sightline-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Test (runs on PRs and pushes)
  # ─────────────────────────────────────────────
  lint-test-backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Type check (basic)
        run: python -m py_compile main.py

      - name: Run tests
        run: |
          EXIT=0; pytest --tb=short -q || EXIT=$?
          # Exit code 5 = no tests collected — acceptable
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 5 ]; then exit "$EXIT"; fi

  lint-test-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 2: Deploy to Cloud Run (on push to main)
  # Strategy: docker build → push to Artifact Registry → deploy image
  # This avoids Cloud Build permission issues with WIF.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: [lint-test-backend, lint-test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GCP_REGION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}

    steps:
      - uses: actions/checkout@v5

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GOOGLE_CLOUD_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project="$GCP_PROJECT" \
            --location="$GCP_REGION" \
            --format="value(name)" 2>/dev/null \
          || gcloud artifacts repositories create "$AR_REPO" \
            --project="$GCP_PROJECT" \
            --location="$GCP_REGION" \
            --repository-format=docker \
            --description="SightLine container images" \
            --quiet

      # ── Build & push images (parallel via docker buildx) ──
      - name: Set image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}"
          echo "backend=${REGISTRY}/${BACKEND_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${BACKEND_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${FRONTEND_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${FRONTEND_IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ steps.tags.outputs.backend_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ steps.tags.outputs.frontend_latest }}
          build-args: |
            NEXT_PUBLIC_WS_URL=placeholder

      # ── Deploy backend to Cloud Run ──
      - name: Deploy backend
        run: |
          gcloud run deploy sightline-backend \
            --quiet \
            --image="${{ steps.tags.outputs.backend }}" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=$GCP_PROJECT,GOOGLE_CLOUD_LOCATION=$GCP_REGION,GCS_BUCKET=${{ secrets.GCS_BUCKET }},GOOGLE_GENAI_USE_VERTEXAI=TRUE" \
            --set-secrets="API_TOKEN=sightline-api-token:latest" \
            --min-instances=0 \
            --max-instances=4 \
            --concurrency=20 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe sightline-backend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format="value(status.url)")
          WS_URL=$(echo "$URL" | sed 's|https://|wss://|')/ws
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ws_url=$WS_URL" >> "$GITHUB_OUTPUT"

      # ── Rebuild frontend with real backend URL baked in ──
      - name: Rebuild and push frontend with backend URL
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ steps.tags.outputs.frontend_latest }}
          build-args: |
            NEXT_PUBLIC_WS_URL=${{ steps.backend.outputs.ws_url }}
            NEXT_PUBLIC_API_URL=${{ steps.backend.outputs.url }}
            NEXT_PUBLIC_API_TOKEN=${{ secrets.API_TOKEN }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      # ── Deploy frontend to Cloud Run ──
      - name: Get frontend URL for NextAuth
        id: frontend_url
        run: |
          # Try to get existing URL, or use a placeholder for first deploy
          URL=$(gcloud run services describe sightline-frontend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: |
          FRONTEND_URL="${{ steps.frontend_url.outputs.url }}"
          gcloud run deploy sightline-frontend \
            --quiet \
            --image="${{ steps.tags.outputs.frontend }}" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --port=3000

      # ── Update backend CORS with frontend URL ──
      - name: Update backend CORS
        run: |
          FRONTEND_URL=$(gcloud run services describe sightline-frontend \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format="value(status.url)")
          gcloud run services update sightline-backend --quiet \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --update-env-vars="FRONTEND_ORIGIN=$FRONTEND_URL"

      # ── Verify deployment ──
      - name: Health check
        run: |
          echo "Backend: ${{ steps.backend.outputs.url }}"
          # Wait for cold start
          sleep 5
          curl -sf --retry 3 --retry-delay 5 "${{ steps.backend.outputs.url }}/health"
          echo ""
          echo "Deployment successful!"
