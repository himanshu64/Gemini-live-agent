<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient: deep dark blue to black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </linearGradient>

    <!-- Accent glow for the eye -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0" />
    </radialGradient>

    <!-- Gemini-style gradient for title text -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7" />
      <stop offset="50%" style="stop-color:#a78bfa" />
      <stop offset="100%" style="stop-color:#34d399" />
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong glow for eye -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle glow for grid lines -->
    <filter id="subtleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid lines (subtle tech feel) -->
  <g opacity="0.07" stroke="#4f8ef7" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
    <!-- Horizontal lines -->
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
  </g>

  <!-- Left side: eye icon with glow -->
  <!-- Glow halo -->
  <circle cx="220" cy="315" r="130" fill="url(#eyeGlow)" />

  <!-- Outer eye ring -->
  <circle cx="220" cy="315" r="100" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.3" filter="url(#subtleGlow)" />
  <circle cx="220" cy="315" r="80" fill="none" stroke="#4f8ef7" stroke-width="1" opacity="0.2" />

  <!-- Eye shape (stylized) -->
  <g filter="url(#strongGlow)">
    <path d="M 80 315 Q 150 215 220 215 Q 290 215 360 315 Q 290 415 220 415 Q 150 415 80 315 Z"
          fill="none" stroke="#4f8ef7" stroke-width="2.5" opacity="0.9" />
  </g>

  <!-- Iris -->
  <circle cx="220" cy="315" r="55" fill="none" stroke="#4f8ef7" stroke-width="2" opacity="0.6" filter="url(#glow)" />

  <!-- Pupil -->
  <circle cx="220" cy="315" r="30" fill="#0d1f4a" stroke="#4f8ef7" stroke-width="2" filter="url(#strongGlow)" />
  <circle cx="220" cy="315" r="18" fill="#4f8ef7" opacity="0.9" filter="url(#glow)" />

  <!-- Pupil highlight -->
  <circle cx="210" cy="305" r="6" fill="white" opacity="0.6" />

  <!-- AI scan lines across eye -->
  <g opacity="0.25" stroke="#4f8ef7" stroke-width="1">
    <line x1="85" y1="295" x2="355" y2="295" />
    <line x1="85" y1="315" x2="355" y2="315" />
    <line x1="85" y1="335" x2="355" y2="335" />
  </g>

  <!-- Waveform / audio bars below eye -->
  <g transform="translate(140, 445)" opacity="0.7" filter="url(#glow)">
    <rect x="0"  y="15" width="8" height="10" rx="2" fill="#4f8ef7" />
    <rect x="14" y="8"  width="8" height="17" rx="2" fill="#4f8ef7" />
    <rect x="28" y="2"  width="8" height="23" rx="2" fill="#a78bfa" />
    <rect x="42" y="8"  width="8" height="17" rx="2" fill="#4f8ef7" />
    <rect x="56" y="12" width="8" height="13" rx="2" fill="#4f8ef7" />
    <rect x="70" y="5"  width="8" height="20" rx="2" fill="#34d399" />
    <rect x="84" y="10" width="8" height="15" rx="2" fill="#4f8ef7" />
    <rect x="98" y="3"  width="8" height="22" rx="2" fill="#a78bfa" />
    <rect x="112" y="9" width="8" height="16" rx="2" fill="#4f8ef7" />
    <rect x="126" y="13" width="8" height="12" rx="2" fill="#4f8ef7" />
    <rect x="140" y="6" width="8" height="19" rx="2" fill="#34d399" />
    <rect x="154" y="11" width="8" height="14" rx="2" fill="#4f8ef7" />
  </g>

  <!-- Right side: text content -->
  <!-- Tagline chip -->
  <rect x="450" y="130" width="290" height="32" rx="16" fill="#4f8ef7" fill-opacity="0.15" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.4" />
  <text x="595" y="151" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#4f8ef7" text-anchor="middle" letter-spacing="2" font-weight="500">GEMINI LIVE AGENT CHALLENGE</text>

  <!-- Main title: SightLine -->
  <text x="450" y="240" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-2">SightLine</text>

  <!-- Tagline -->
  <text x="452" y="285" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="300" letter-spacing="0.5">Your AI eyes, always ready to help.</text>

  <!-- Divider line -->
  <line x1="450" y1="310" x2="800" y2="310" stroke="#4f8ef7" stroke-width="1" opacity="0.2" />

  <!-- Feature pills -->
  <!-- Real-time -->
  <rect x="450" y="330" width="130" height="36" rx="18" fill="#1e3a5f" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.5" />
  <text x="515" y="353" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#4f8ef7" text-anchor="middle" font-weight="500">Real-Time Audio</text>

  <!-- Vision -->
  <rect x="595" y="330" width="110" height="36" rx="18" fill="#2d1b69" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5" />
  <text x="650" y="353" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="500">Live Vision</text>

  <!-- Barge-in -->
  <rect x="720" y="330" width="110" height="36" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
  <text x="775" y="353" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#34d399" text-anchor="middle" font-weight="500">Barge-In</text>

  <!-- Tech stack row -->
  <text x="452" y="415" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" letter-spacing="0.5">POWERED BY</text>

  <!-- Gemini badge -->
  <rect x="450" y="428" width="150" height="38" rx="8" fill="#1a1f35" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.3" />
  <text x="525" y="452" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="500">Gemini 2.5 Flash</text>

  <!-- Google ADK badge -->
  <rect x="614" y="428" width="120" height="38" rx="8" fill="#1a1f35" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3" />
  <text x="674" y="452" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="500">Google ADK</text>

  <!-- Cloud Run badge -->
  <rect x="748" y="428" width="120" height="38" rx="8" fill="#1a1f35" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
  <text x="808" y="452" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="500">Cloud Run</text>

  <!-- Authors -->
  <text x="452" y="520" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#475569">Himanshu Sharma · Ashish Beck</text>

  <!-- Bottom accent line (gradient) -->
  <rect x="0" y="618" width="1200" height="3" fill="url(#titleGrad)" opacity="0.8" />

  <!-- Corner decoration dots -->
  <circle cx="30" cy="30" r="3" fill="#4f8ef7" opacity="0.4" />
  <circle cx="50" cy="30" r="3" fill="#4f8ef7" opacity="0.2" />
  <circle cx="30" cy="50" r="3" fill="#4f8ef7" opacity="0.2" />

  <circle cx="1170" cy="600" r="3" fill="#34d399" opacity="0.4" />
  <circle cx="1150" cy="600" r="3" fill="#34d399" opacity="0.2" />
  <circle cx="1170" cy="580" r="3" fill="#34d399" opacity="0.2" />
</svg>
