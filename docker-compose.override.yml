version: "3.9"

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8080
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/sa-key.json

  frontend:
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
