global:
  project: sightline
  imageRegistry: gcr.io/REPLACE_PROJECT_ID

backend:
  replicaCount: 2
  image:
    repository: sightline-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  env:
    GOOGLE_CLOUD_LOCATION: us-central1
    GCS_BUCKET: ""
    FRONTEND_ORIGIN: ""

frontend:
  replicaCount: 2
  image:
    repository: sightline-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  hosts:
    - host: sightline.example.com
  tls:
    enabled: true
    secretName: sightline-tls

networkPolicy:
  enabled: true

rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # Set to enable Workload Identity (recommended over SA key files).
  # Example: sightline-backend@YOUR_PROJECT.iam.gserviceaccount.com
  gcpServiceAccount: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secrets:
  gcpProjectId: ""
  # Required: API authentication token (must match frontend NEXT_PUBLIC_API_TOKEN).
  apiToken: ""
  # Optional: only needed if NOT using Workload Identity.
  # Leave empty to use Workload Identity (recommended).
  gcpSaKey: ""
