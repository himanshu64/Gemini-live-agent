global:
  imageRegistry: gcr.io/sightline-prod

backend:
  replicaCount: 3
  hpa:
    minReplicas: 3
    maxReplicas: 15
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    FRONTEND_ORIGIN: https://sightline.example.com

frontend:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8

ingress:
  hosts:
    - host: sightline.example.com
  tls:
    secretName: sightline-prod-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 2
