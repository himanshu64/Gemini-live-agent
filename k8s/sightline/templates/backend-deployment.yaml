apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sightline.fullname" . }}-backend
  namespace: {{ include "sightline.namespace" . }}
  labels:
    {{- include "sightline.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "sightline.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sightline.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sightline.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "sightline.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sightline.fullname" . }}-config
          env:
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: {{ include "sightline.fullname" . }}-secrets
                  key: GOOGLE_CLOUD_PROJECT
                  optional: true
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sightline.fullname" . }}-secrets
                  key: API_TOKEN
            {{- if .Values.secrets.gcpSaKey }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/gcp-sa-key.json
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.gcpSaKey }}
            - name: gcp-sa-key
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.gcpSaKey }}
        - name: gcp-sa-key
          secret:
            secretName: {{ include "sightline.fullname" . }}-secrets
            optional: true
        {{- end }}
