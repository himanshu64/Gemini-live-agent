apiVersion: v1
kind: Service
metadata:
  name: {{ include "sightline.fullname" . }}-backend
  namespace: {{ include "sightline.namespace" . }}
  labels:
    {{- include "sightline.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sightline.backend.selectorLabels" . | nindent 4 }}
