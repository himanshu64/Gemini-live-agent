{{- if .Values.networkPolicy.enabled }}
---
# Default deny all traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sightline.fullname" . }}-default-deny
  namespace: {{ include "sightline.namespace" . }}
  labels:
    {{- include "sightline.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Backend network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sightline.fullname" . }}-backend
  namespace: {{ include "sightline.namespace" . }}
  labels:
    {{- include "sightline.backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sightline.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from frontend pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "sightline.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to GCP APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
# Frontend network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sightline.fullname" . }}-frontend
  namespace: {{ include "sightline.namespace" . }}
  labels:
    {{- include "sightline.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sightline.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to backend
    - to:
        - podSelector:
            matchLabels:
              {{- include "sightline.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
