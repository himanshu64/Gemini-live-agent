global:
  imageRegistry: gcr.io/sightline-staging

backend:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    FRONTEND_ORIGIN: https://staging.sightline.example.com

frontend:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2

ingress:
  hosts:
    - host: staging.sightline.example.com
  tls:
    secretName: sightline-staging-tls

podDisruptionBudget:
  enabled: false
